<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>微观云导航</title>
    <meta name="description" content="微观云导航为用户提供旗下所有网站，避免用户丢失或不记得微观云所搭建的网站!">
    <meta name="keywords" content="微观云,导航,微观云导航,网址导航">
    <link rel="icon" type="image/ico" href="https://api.wgynav.com/static/favicon.ico">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Helvetica Neue', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            position: relative;
        }

        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: url(https://api.sretna.cn/api/anime.php) no-repeat center / cover;
            filter: blur(30px);
            z-index: -2;
        }

        body::after {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.2);
            pointer-events: none;
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 700px;
            background: #fffffff2;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 32px rgba(255, 255, 255, 0.5), 0 4px 16px rgba(0, 0, 0, 0.1);
            position: relative;
            z-index: 1;
        }

        /* Banner */
        .banner {
            position: relative;
            height: 300px;
            overflow: hidden;
        }

        .banner video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .banner-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.2);
            z-index: 1;
        }

        .banner-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 10px;
        }

        .banner-title {
            font-size: 24px;
            font-weight: bold;
            color: black;
            text-shadow: 0 1px 3px rgba(255,255,255,0.8), 0 -1px 3px rgba(255,255,255,0.8), 1px 0 3px rgba(255,255,255,0.8), -1px 0 3px rgba(255,255,255,0.8);
        }

        .bookmark-btn {
            background-color: black;
            color: white;
            border: none;
            padding: 8px 40px;
            border-radius: 4px;
            font-size: 12px;
            cursor: pointer;
            transition: opacity 0.2s ease;
        }

        .bookmark-btn:hover {
            opacity: 0.8;
        }

        /* Content */
        .content {
            padding: 20px;
        }

        .section-title {
            font-size: 16px;
            font-weight: 500;
            margin-bottom: 15px;
            color: #333;
        }

        /* Latency Tester */
        .latency-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 15px;
        }

        .latency-header-left {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .latency-stats {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 12px;
            color: #999;
        }

        .latency-stats .stat {
            display: flex;
            align-items: center;
            gap: 3px;
        }

        .latency-stats .dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-green { background-color: #10b981; }
        .dot-red { background-color: #ef4444; }

        .retest-btn {
            display: flex;
            align-items: center;
            gap: 5px;
            padding: 6px 12px;
            font-size: 12px;
            font-weight: 500;
            color: white;
            background-color: #333;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: opacity 0.2s ease;
            font-family: inherit;
        }

        .retest-btn:hover {
            opacity: 0.8;
        }

        .retest-btn:disabled {
            opacity: 0.5;
            cursor: default;
        }

        .retest-btn svg {
            width: 12px;
            height: 12px;
        }

        .retest-btn.testing svg {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Site items */
        .site-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 12px;
        }

        .site-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid #f0f0f0;
            background: white;
            transition: all 0.2s ease;
            cursor: default;
            font-family: inherit;
            width: 100%;
            text-align: left;
        }

        .site-item.clickable {
            cursor: pointer;
        }

        .site-item.clickable:hover {
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .site-item.clickable:active {
            transform: scale(0.995);
        }

        .site-item.status-ok-fast {
            background: rgba(16, 185, 129, 0.06);
            border-color: rgba(16, 185, 129, 0.15);
        }

        .site-item.status-ok-medium {
            background: rgba(245, 158, 11, 0.06);
            border-color: rgba(245, 158, 11, 0.15);
        }

        .site-item.status-ok-slow {
            background: rgba(239, 68, 68, 0.06);
            border-color: rgba(239, 68, 68, 0.15);
        }

        .site-item.status-timeout {
            background: rgba(239, 68, 68, 0.06);
            border-color: rgba(239, 68, 68, 0.15);
            opacity: 0.7;
        }

        .site-item.status-testing {
            background: #fafafa;
            border-color: #f0f0f0;
        }

        .site-icon {
            width: 20px;
            height: 20px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .site-icon svg {
            width: 16px;
            height: 16px;
        }

        .site-name {
            font-size: 14px;
            font-weight: 500;
            color: #333;
            flex: 1;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .site-url {
            font-size: 12px;
            color: #bbb;
            max-width: 200px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        @media (max-width: 640px) {
            .site-url {
                display: none;
            }
        }

        /* Latency bar */
        .latency-bar {
            width: 60px;
            height: 5px;
            border-radius: 3px;
            background: #f0f0f0;
            overflow: hidden;
            flex-shrink: 0;
        }

        .latency-bar-fill {
            height: 100%;
            border-radius: 3px;
            transition: width 0.6s ease-out;
            width: 0%;
        }

        .bar-green { background-color: #10b981; }
        .bar-amber { background-color: #f59e0b; }
        .bar-red { background-color: #ef4444; }
        .bar-gray { background-color: #d1d5db; }

        .latency-bar-fill.testing {
            width: 50% !important;
            background-color: #d1d5db;
            animation: pulse 1.5s ease-in-out infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 0.4; }
            50% { opacity: 1; }
        }

        /* Latency value */
        .latency-value {
            font-size: 12px;
            font-family: 'SF Mono', 'Menlo', 'Monaco', monospace;
            width: 60px;
            text-align: right;
            flex-shrink: 0;
        }

        .text-green { color: #10b981; }
        .text-amber { color: #f59e0b; }
        .text-red { color: #ef4444; }
        .text-gray { color: #bbb; }

        /* Legend */
        .legend {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 16px;
            font-size: 12px;
            color: #999;
            padding-top: 4px;
            margin-bottom: 24px;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .legend-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
        }

        /* Sub sites */
        .inline-items {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            margin-bottom: 20px;
        }

        @media (max-width: 768px) {
            .inline-items {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        @media (max-width: 480px) {
            .inline-items {
                grid-template-columns: repeat(2, 1fr);
                gap: 10px;
            }
        }

        .inline-item {
            display: flex;
            align-items: center;
            padding: 15px;
            background: white;
            border: 1px solid #e7e7e7;
            border-radius: 4px;
            cursor: pointer;
            transition: background-color 0.2s ease;
            font-size: 13px;
            color: #333;
            font-family: inherit;
            text-align: left;
        }

        .inline-item:hover {
            background-color: #cccccc;
        }

        .card-item-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .card-item-text {
            color: #333;
            font-size: 14px;
        }

        /* Modal */
        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            align-items: center;
            justify-content: center;
        }

        .modal.show {
            display: flex;
        }

        .modal-content {
            background-color: #fefefe;
            padding: 20px;
            border-radius: 8px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.3);
            text-align: center;
        }

        .modal-content h2 {
            margin-bottom: 10px;
            color: #333;
        }

        .modal-content p {
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
            line-height: 1.6;
        }

        .modal-button {
            background-color: black;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            transition: opacity 0.2s ease;
        }

        .modal-button:hover {
            opacity: 0.8;
        }

        /* Crisp logo */
        .yuntucao-link {
            position: fixed;
            bottom: 40px;
            right: 20px;
            z-index: 9999;
        }

        .logo {
            width: 70px;
            height: 70px;
            background-image: url(https://s21.ax1x.com/2025/10/06/pV7wiEn.png);
            background-repeat: no-repeat;
            background-position: center;
            box-shadow: 0 0 10px rgba(12,12,12,0.3);
            border-radius: 100%;
            border: 1px solid #f00;
        }

        .logo-wrap:hover .logo {
            background-image: url(https://s21.ax1x.com/2025/10/06/pV7wCHs.png);
            box-shadow: 0 0 10px rgb(255 0 0 / 60%);
        }

        .yuntucao-link:hover .tips-wrap {
            display: block;
            background: #418dff;
        }

        .tips-wrap {
            position: relative;
            display: none;
        }

        .tips {
            width: 86px;
            height: 32px;
            background: #4e4e4e;
            border-radius: 4px;
            position: absolute;
            left: -98px;
            top: -44px;
            color: #fff;
            text-align: center;
            line-height: 32px;
            font-size: 14px;
        }

        .tips:after {
            content: " ";
            display: block;
            width: 0;
            height: 0;
            border-top: 6px solid transparent;
            border-bottom: 6px solid transparent;
            border-left: 6px solid #4e4e4e;
            position: absolute;
            right: -6px;
            top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Banner -->
        <div class="banner">
            <video autoplay muted loop playsinline>
                <source src="https://api.wgynav.com/bgmp4.php" type="video/mp4">
            </video>
            <div class="banner-overlay"></div>
            <div class="banner-content">
                <div class="banner-title">微观云导航</div>
                <button class="bookmark-btn" onClick="bookmarkSite()">收藏本站</button>
            </div>
        </div>

        <!-- Content -->
        <div class="content">
            <!-- Latency Tester Section -->
            <div>
                <div class="latency-header">
                    <div class="latency-header-left">
                        <div class="section-title" style="margin-bottom: 0;">微观云网站</div>
                        <div class="latency-stats" id="latencyStats"></div>
                    </div>
                    <button class="retest-btn" id="retestBtn" onClick="loadAndTest()">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/></svg>
                        <span id="retestText">重新测速</span>
                    </button>
                </div>

                <div class="site-list" id="siteList">
                    <!-- Sites will be dynamically injected -->
                </div>

                <div class="legend" id="legend" style="display: none;">
                    <span class="legend-item"><span class="legend-dot" style="background:#10b981;"></span> &lt; 300ms</span>
                    <span class="legend-item"><span class="legend-dot" style="background:#f59e0b;"></span> 300-800ms</span>
                    <span class="legend-item"><span class="legend-dot" style="background:#ef4444;"></span> &gt; 800ms / 超时</span>
                </div>
            </div>

            <!-- Sub sites -->
            <div class="section-title">旗下网站</div>
            <div class="inline-items">
                <button class="inline-item" data-url="https://www.wgyfaq.com">
                    <div class="card-item-left">
                        <img src="https://stimg.de/img/2026/01/03/6TJlM.png" alt="知识库" style="width:24px;height:24px;border-radius:4px;">
                        <div class="card-item-text">知识库</div>
                    </div>
                </button>
                <button class="inline-item" data-url="https://www.wgyfaq.com/d/6">
                    <div class="card-item-left">
                        <img src="https://stimg.de/img/2026/01/03/6TOm7.png" alt="AppleID获取" style="width:24px;height:24px;border-radius:4px;">
                        <div class="card-item-text">AppleID获取</div>
                    </div>
                </button>
                <button class="inline-item" data-url="https://www.monmiao.com">
                    <div class="card-item-left">
                        <img src="https://stimg.de/img/2026/01/03/6TGsS.png" alt="萌喵影视" style="width:24px;height:24px;border-radius:4px;">
                        <div class="card-item-text">萌喵影视</div>
                    </div>
                </button>
            </div>
        </div>
    </div>

    <!-- Bookmark Modal -->
    <div id="bookmarkModal" class="modal">
        <div class="modal-content">
            <h2>收藏本站</h2>
            <p>请使用快捷键将【微观云导航】添加到浏览器书签</p>
            <p><strong>Windows: Ctrl + D</strong></p>
            <p><strong>MacOS: Cmd + D</strong></p>
            <button class="modal-button" onClick="closeBookmarkModal()">关闭</button>
        </div>
    </div>

    <script>
        // ========== SVG Icons ==========
        var ICONS = {
            globe: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>',
            spinner: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#bbb" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="animation:spin 1s linear infinite"><path d="M21 12a9 9 0 1 1-6.219-8.56"/></svg>',
            zap: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#10b981" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg>',
            clock: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#f59e0b" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>',
            alert: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>'
        };

        // ========== State ==========
        var sites = [];
        var isTesting = false;
        var doneCount = 0;

        // ========== Bookmark ==========
        function bookmarkSite() {
            document.getElementById('bookmarkModal').classList.add('show');
        }

        function closeBookmarkModal() {
            document.getElementById('bookmarkModal').classList.remove('show');
        }

        window.onclick = function(e) {
            var modal = document.getElementById('bookmarkModal');
            if (e.target === modal) modal.classList.remove('show');
        };

        // ========== Sub-site clicks ==========
        document.querySelectorAll('.inline-item').forEach(function(item) {
            item.addEventListener('click', function() {
                var url = this.getAttribute('data-url');
                if (url) window.open(url, '_blank');
            });
        });

        // ========== Latency Testing ==========
        function parseSites(text) {
            return text.split('\n')
                .map(function(line) { return line.trim(); })
                .filter(function(line) { return line && line.indexOf('|') !== -1; })
                .map(function(line) {
                    var parts = line.split('|');
                    return {
                        name: parts[0].trim(),
                        url: parts[1].trim(),
                        latency: null,
                        status: 'pending'
                    };
                });
        }

        function testSiteLatency(url) {
            return new Promise(function(resolve) {
                var img = new Image();
                var start = Date.now();
                var done = false;
                var timer = setTimeout(function() {
                    if (done) return;
                    done = true;
                    img.onload = img.onerror = null;
                    img.src = '';
                    resolve({ latency: null, status: 'timeout' });
                }, 5000);

                img.onload = img.onerror = function() {
                    if (done) return;
                    done = true;
                    clearTimeout(timer);
                    var latency = Date.now() - start;
                    resolve({ latency: latency, status: 'ok' });
                };

                // Append timestamp to bypass cache
                var separator = url.indexOf('?') !== -1 ? '&' : '?';
                img.src = url + '/favicon.ico' + separator + '_t=' + Date.now();
            });
        }

        function getIcon(site) {
            if (site.status === 'testing') return ICONS.spinner;
            if (site.status === 'timeout') return ICONS.alert;
            if (site.status === 'ok' && site.latency !== null) {
                if (site.latency < 300) return ICONS.zap;
                if (site.latency < 800) return ICONS.clock;
                return ICONS.alert;
            }
            return ICONS.globe;
        }

        function getBarInfo(site) {
            if (site.status === 'testing') return { width: '50%', cls: 'bar-gray testing' };
            if (site.status === 'timeout') return { width: '100%', cls: 'bar-red' };
            if (site.latency === null) return { width: '0%', cls: 'bar-gray' };
            var pct = Math.min((site.latency / 3000) * 100, 100);
            var cls = site.latency < 300 ? 'bar-green' : site.latency < 800 ? 'bar-amber' : 'bar-red';
            return { width: pct + '%', cls: cls };
        }

        function getLatencyText(site) {
            if (site.status === 'testing') return { text: '...', cls: 'text-gray' };
            if (site.status === 'timeout') return { text: '超时', cls: 'text-red' };
            if (site.latency === null) return { text: '--', cls: 'text-gray' };
            var cls = site.latency < 300 ? 'text-green' : site.latency < 800 ? 'text-amber' : 'text-red';
            return { text: site.latency + 'ms', cls: cls };
        }

        function getItemClass(site) {
            var base = 'site-item';
            if (site.status === 'ok') {
                base += ' clickable';
                if (site.latency < 300) base += ' status-ok-fast';
                else if (site.latency < 800) base += ' status-ok-medium';
                else base += ' status-ok-slow';
            } else if (site.status === 'timeout') {
                base += ' status-timeout';
            } else {
                base += ' status-testing';
            }
            return base;
        }

        function sortSites(arr) {
            var order = { ok: 0, testing: 1, pending: 2, timeout: 3 };
            return arr.slice().sort(function(a, b) {
                if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
                if (a.status === 'ok' && b.status === 'ok') return (a.latency || 9999) - (b.latency || 9999);
                return 0;
            });
        }

        function render() {
            var list = document.getElementById('siteList');
            var sorted = sortSites(sites);
            var html = '';

            sorted.forEach(function(site) {
                var bar = getBarInfo(site);
                var lt = getLatencyText(site);
                html += '<button class="' + getItemClass(site) + '" ' +
                    (site.status === 'ok' ? 'onclick="window.open(\'' + site.url + '\', \'_blank\')"' : '') + '>' +
                    '<span class="site-icon">' + getIcon(site) + '</span>' +
                    '<span class="site-name">' + site.name + '</span>' +
                    '<span class="latency-value ' + lt.cls + '">' + lt.text + '</span>' +
                    '</button>';
            });

            list.innerHTML = html;

            // Stats
            var statsEl = document.getElementById('latencyStats');
            if (!isTesting && sites.length > 0) {
                var okCount = sites.filter(function(s) { return s.status === 'ok'; }).length;
                var timeoutCount = sites.filter(function(s) { return s.status === 'timeout'; }).length;
                var statsHtml = '';
                if (okCount > 0) statsHtml += '<span class="stat"><span class="dot dot-green"></span> ' + okCount + ' 正常</span>';
                if (timeoutCount > 0) statsHtml += '<span class="stat"><span class="dot dot-red"></span> ' + timeoutCount + ' 超时</span>';
                statsEl.innerHTML = statsHtml;
            } else {
                statsEl.innerHTML = '';
            }

            // Legend
            document.getElementById('legend').style.display = (!isTesting && sites.length > 0) ? 'flex' : 'none';

            // Button
            var btn = document.getElementById('retestBtn');
            var btnText = document.getElementById('retestText');
            btn.disabled = isTesting;
            if (isTesting) {
                btn.classList.add('testing');
                btnText.textContent = '测速中 (' + doneCount + '/' + sites.length + ')';
            } else {
                btn.classList.remove('testing');
                btnText.textContent = '重新测速';
            }
        }

        function loadAndTest() {
            if (isTesting) return;
            isTesting = true;
            doneCount = 0;
            sites = [];
            render();

            // Try to fetch sites.txt from same directory
            fetch('https://api.wgynav.com/sites.txt')
                .then(function(res) {
                    if (!res.ok) throw new Error('Failed');
                    return res.text();
                })
                .then(function(text) {
                    sites = parseSites(text);
                    sites.forEach(function(s) { s.status = 'testing'; });
                    render();
                    runTests();
                })
                .catch(function() {
                    // Fallback: use embedded site list
                    var fallback = [
                        '腾讯|https:/qq.com',
                        '百度|https://www.baidu.com/',
                    ].join('\n');
                    sites = parseSites(fallback);
                    sites.forEach(function(s) { s.status = 'testing'; });
                    render();
                    runTests();
                });
        }

        function runTests() {
            var promises = sites.map(function(site, idx) {
                return testSiteLatency(site.url).then(function(result) {
                    sites[idx].latency = result.latency;
                    sites[idx].status = result.status;
                    doneCount++;
                    render();
                });
            });

            Promise.all(promises).then(function() {
                isTesting = false;
                render();
            });
        }

        // Start testing on page load
        loadAndTest();
    </script>
