        // ========== State ==========
        var sites = [];
        var isTesting = false;
        var doneCount = 0;

        // ========== Bookmark ==========
        function bookmarkSite() {
            document.getElementById('bookmarkModal').classList.add('show');
        }

        function closeBookmarkModal() {
            document.getElementById('bookmarkModal').classList.remove('show');
        }

        window.onclick = function(e) {
            var modal = document.getElementById('bookmarkModal');
            if (e.target === modal) modal.classList.remove('show');
        };

        // ========== Sub-site clicks ==========
        document.querySelectorAll('.inline-item').forEach(function(item) {
            item.addEventListener('click', function() {
                var url = this.getAttribute('data-url');
                if (url) window.open(url, '_blank');
            });
        });

        // ========== Latency Testing ==========
        function parseSites(text) {
            return text.split('\n')
                .map(function(line) { return line.trim(); })
                .filter(function(line) { return line && line.indexOf('|') !== -1; })
                .map(function(line) {
                    var parts = line.split('|');
                    return {
                        name: parts[0].trim(),
                        url: parts[1].trim(),
                        latency: null,
                        status: 'pending'
                    };
                });
        }

        function testSiteLatency(url) {
            return new Promise(function(resolve) {
                var img = new Image();
                var start = Date.now();
                var done = false;
                var timer = setTimeout(function() {
                    if (done) return;
                    done = true;
                    img.onload = img.onerror = null;
                    img.src = '';
                    resolve({ latency: null, status: 'timeout' });
                }, 5000);

                img.onload = img.onerror = function() {
                    if (done) return;
                    done = true;
                    clearTimeout(timer);
                    var latency = Date.now() - start;
                    resolve({ latency: latency, status: 'ok' });
                };

                // Append timestamp to bypass cache
                var separator = url.indexOf('?') !== -1 ? '&' : '?';
                img.src = url + '/favicon.ico' + separator + '_t=' + Date.now();
            });
        }

        function getIcon(site) {
            if (site.status === 'testing') return ICONS.spinner;
            if (site.status === 'timeout') return ICONS.alert;
            if (site.status === 'ok' && site.latency !== null) {
                if (site.latency < 300) return ICONS.zap;
                if (site.latency < 800) return ICONS.clock;
                return ICONS.alert;
            }
            return ICONS.globe;
        }

        function getBarInfo(site) {
            if (site.status === 'testing') return { width: '50%', cls: 'bar-gray testing' };
            if (site.status === 'timeout') return { width: '100%', cls: 'bar-red' };
            if (site.latency === null) return { width: '0%', cls: 'bar-gray' };
            var pct = Math.min((site.latency / 3000) * 100, 100);
            var cls = site.latency < 300 ? 'bar-green' : site.latency < 800 ? 'bar-amber' : 'bar-red';
            return { width: pct + '%', cls: cls };
        }

        function getLatencyText(site) {
            if (site.status === 'testing') return { text: '...', cls: 'text-gray' };
            if (site.status === 'timeout') return { text: '超时', cls: 'text-red' };
            if (site.latency === null) return { text: '--', cls: 'text-gray' };
            var cls = site.latency < 300 ? 'text-green' : site.latency < 800 ? 'text-amber' : 'text-red';
            return { text: site.latency + 'ms', cls: cls };
        }

        function getItemClass(site) {
            var base = 'site-item';
            if (site.status === 'ok') {
                base += ' clickable';
                if (site.latency < 300) base += ' status-ok-fast';
                else if (site.latency < 800) base += ' status-ok-medium';
                else base += ' status-ok-slow';
            } else if (site.status === 'timeout') {
                base += ' status-timeout';
            } else {
                base += ' status-testing';
            }
            return base;
        }

        function sortSites(arr) {
            var order = { ok: 0, testing: 1, pending: 2, timeout: 3 };
            return arr.slice().sort(function(a, b) {
                if (order[a.status] !== order[b.status]) return order[a.status] - order[b.status];
                if (a.status === 'ok' && b.status === 'ok') return (a.latency || 9999) - (b.latency || 9999);
                return 0;
            });
        }

        function render() {
            var list = document.getElementById('siteList');
            var sorted = sortSites(sites);
            var html = '';

            sorted.forEach(function(site) {
                var bar = getBarInfo(site);
                var lt = getLatencyText(site);
                html += '<button class="' + getItemClass(site) + '" ' +
                    (site.status === 'ok' ? 'onclick="window.open(\'' + site.url + '\', \'_blank\')"' : '') + '>' +
                    '<span class="site-icon">' + getIcon(site) + '</span>' +
                    '<span class="site-name">' + site.name + '</span>' +
                    '<span class="latency-value ' + lt.cls + '">' + lt.text + '</span>' +
                    '</button>';
            });

            list.innerHTML = html;

            // Stats
            var statsEl = document.getElementById('latencyStats');
            if (!isTesting && sites.length > 0) {
                var okCount = sites.filter(function(s) { return s.status === 'ok'; }).length;
                var timeoutCount = sites.filter(function(s) { return s.status === 'timeout'; }).length;
                var statsHtml = '';
                if (okCount > 0) statsHtml += '<span class="stat"><span class="dot dot-green"></span> ' + okCount + ' 正常</span>';
                if (timeoutCount > 0) statsHtml += '<span class="stat"><span class="dot dot-red"></span> ' + timeoutCount + ' 超时</span>';
                statsEl.innerHTML = statsHtml;
            } else {
                statsEl.innerHTML = '';
            }

            // Legend
            document.getElementById('legend').style.display = (!isTesting && sites.length > 0) ? 'flex' : 'none';

            // Button
            var btn = document.getElementById('retestBtn');
            var btnText = document.getElementById('retestText');
            btn.disabled = isTesting;
            if (isTesting) {
                btn.classList.add('testing');
                btnText.textContent = '测速中 (' + doneCount + '/' + sites.length + ')';
            } else {
                btn.classList.remove('testing');
                btnText.textContent = '重新测速';
            }
        }

        function loadAndTest() {
            if (isTesting) return;
            isTesting = true;
            doneCount = 0;
            sites = [];
            render();

            // Try to fetch sites.txt from same directory
			//fetch('https://api.wgynav.com/sites.txt')
            fetch()
                .then(function(res) {
                    if (!res.ok) throw new Error('Failed');
                    return res.text();
                })
                .then(function(text) {
                    sites = parseSites(text);
                    sites.forEach(function(s) { s.status = 'testing'; });
                    render();
                    runTests();
                })
                .catch(function() {
                    // Fallback: use embedded site list
                    var fallback = [
                        '登录微观云 |https://www.wgy-t8gs.shop/user',
                        '登录微观云 |https://d5x.wgy-e0k1c0.shop/user',
                    ].join('\n');
                    sites = parseSites(fallback);
                    sites.forEach(function(s) { s.status = 'testing'; });
                    render();
                    runTests();
                });
        }

        function runTests() {
            var promises = sites.map(function(site, idx) {
                return testSiteLatency(site.url).then(function(result) {
                    sites[idx].latency = result.latency;
                    sites[idx].status = result.status;
                    doneCount++;
                    render();
                });
            });

            Promise.all(promises).then(function() {
                isTesting = false;
                render();
            });
        }

        // Start testing on page load
        loadAndTest();
    </script>
