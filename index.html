<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    
    <!-- SEO 元标签 -->
    <meta name="description" content="微观云导航为用户提供旗下所有网站，避免用户丢失或不记得微观云所搭建的网站!">
    <meta name="keywords" content="微观云,导航,微观云导航,网址导航">
    
    <!-- 禁止浏览器缓存，强制每次刷新都重新请求 -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    
    <title>微观云导航</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background-color: #d9d9d9;
            background-image: url('https://www.loliapi.com/acg/pc/');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
            background-repeat: no-repeat;
            position: relative;
        }

        /* 背景滤镜：30% 透明度 + 20px 模糊 */
        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(210, 210, 210, 0.3);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            z-index: 0;
        }

        .main-card {
            position: relative;
            z-index: 10;
            width: 100%;
            max-width: 820px;
            background: #ffffff;
            border-radius: 24px;
            box-shadow: 0 20px 40px -12px rgba(0, 0, 0, 0.25), 0 4px 12px rgba(0, 0, 0, 0.06);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* 视频横幅高度 300px */
        .banner-area {
            position: relative;
            width: 100%;
            height: 300px;
            background: #2c2c2c;
            overflow: hidden;
            flex-shrink: 0;
        }

        .banner-video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }

        .banner-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            background: rgba(0, 0, 0, 0.18);
            backdrop-filter: blur(1px);
            padding: 20px;
        }

        /* 标题：黑色字体 + 白色阴影 */
        .banner-title {
            font-size: 32px;
            font-weight: 700;
            color: #000000;
            text-shadow: 0 2px 10px rgba(255, 255, 255, 0.9), 0 4px 20px rgba(255, 255, 255, 0.7);
            letter-spacing: 2px;
            margin-bottom: 16px;
        }

        .banner-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            background: #1e1e1e;
            color: #ffffff;
            border: none;
            padding: 10px 28px;
            border-radius: 8px;
            font-size: 15px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 14px rgba(0, 0, 0, 0.3);
        }

        .banner-btn:hover {
            background: #333333;
            transform: translateY(-1px);
        }

        .content-area {
            padding: 28px 32px 30px;
            color: #1e1e1e;
        }

        .speed-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 20px;
        }

        .speed-title-wrap {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .speed-title {
            font-size: 18px;
            font-weight: 600;
            color: #222;
        }

        .status-badge {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 13px;
            color: #22c55e;
            background: #e6f7e6;
            padding: 4px 10px;
            border-radius: 40px;
            font-weight: 500;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: #22c55e;
            border-radius: 50%;
            display: inline-block;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(0.9); }
        }

        .retest-btn {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #2a2a2a;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 40px;
            font-size: 13px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        .retest-btn:hover {
            background: #444;
        }

        .retest-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
        }

        .retest-btn svg {
            width: 14px;
            height: 14px;
            fill: currentColor;
        }

        /* 测速列表项 */
        .speed-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 24px;
        }

        .speed-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #fdf5f5;
            border: 1px solid #f5e1e1;
            border-radius: 12px;
            padding: 16px 20px;
            text-decoration: none;
            color: #1e1e1e;
            transition: all 0.2s ease;
            cursor: pointer;
        }

        .speed-item:hover {
            background: #fcecec;
            border-color: #f0d0d0;
            transform: translateY(-1px);
            box-shadow: 0 4px 10px rgba(239, 68, 68, 0.06);
        }

        .speed-item .left {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 15px;
            font-weight: 500;
            color: #1e1e1e;
        }

        .lightning-icon {
            width: 24px;
            height: 24px;
            background: #fff1f1;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #ef4444;
            font-size: 16px;
        }

        .speed-item .right {
            font-size: 14px;
            font-weight: 600;
            color: #ef4444;
            letter-spacing: 0.3px;
            transition: color 0.2s;
        }

        .legend-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 28px;
            margin-bottom: 30px;
            font-size: 13px;
            color: #5a5a5a;
        }

        .legend-item {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .legend-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            display: inline-block;
        }

        .dot-green { background: #22c55e; }
        .dot-yellow { background: #eab308; }
        .dot-red { background: #ef4444; }

        .sub-title {
            font-size: 16px;
            font-weight: 600;
            color: #222;
            margin-bottom: 16px;
        }

        .website-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
        }

        .website-card {
            display: flex;
            align-items: center;
            gap: 12px;
            background: #ffffff;
            border: 1px solid #e6e6e6;
            border-radius: 12px;
            padding: 14px 18px;
            text-decoration: none;
            color: #1e1e1e;
            font-size: 15px;
            font-weight: 500;
            transition: all 0.2s ease;
        }

        .website-card:hover {
            border-color: #cccccc;
            box-shadow: 0 6px 14px rgba(0, 0, 0, 0.04);
            transform: translateY(-2px);
            background: #fafafa;
        }

        .website-icon-img {
            width: 32px;
            height: 32px;
            border-radius: 8px;
            object-fit: cover;
            flex-shrink: 0;
            background: #f5f5f5;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #1e1e1e;
            color: white;
            padding: 10px 24px;
            border-radius: 40px;
            font-size: 14px;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.2, 0.9, 0.3, 1.1);
            pointer-events: none;
            z-index: 9999;
            box-shadow: 0 12px 24px -8px rgba(0, 0, 0, 0.4);
            white-space: nowrap;
        }

        .toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }

        @media (max-width: 600px) {
            .main-card {
                border-radius: 20px;
            }
            .banner-area {
                height: 220px;
            }
            .banner-title {
                font-size: 24px;
                margin-bottom: 12px;
            }
            .content-area {
                padding: 20px 18px 24px;
            }
            .website-grid {
                grid-template-columns: 1fr;
                gap: 10px;
            }
            .legend-row {
                gap: 16px;
                font-size: 12px;
            }
            .speed-header {
                flex-direction: column;
                align-items: flex-start;
                gap: 12px;
            }
        }
    </style>
</head>
<body>
    <div class="main-card">
        <!-- 顶部视频横幅 (高度 300px) -->
        <div class="banner-area">
            <video class="banner-video" autoplay loop muted playsinline>
                <source src="https://api.wgynav.com/bgmp4.php" type="video/mp4" id="bannerVideoSource">
            </video>
            <div class="banner-overlay">
                <div class="banner-title">微观云导航</div>
                <button class="banner-btn" id="collectBtn">收藏本站</button>
            </div>
        </div>

        <!-- 内容区 -->
        <div class="content-area">
            <div class="speed-header">
                <div class="speed-title-wrap">
                    <span class="speed-title">站点测速</span>
                    <div class="status-badge" id="globalStatus">
                        <span class="status-dot"></span> 正常
                    </div>
                </div>
                <button class="retest-btn" id="retestBtn">
                    <svg viewBox="0 0 24 24" width="14" height="14">
                        <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg>
                    重新测速
                </button>
            </div>

            <!-- 两个外链卡片 -->
            <div class="speed-list" id="speedList">
                <a href="javascript:void(0)" target="_blank" rel="noopener" class="speed-item" data-url="" data-id="1">
                    <div class="left">
                        <span class="lightning-icon">⚡</span>
                        登录微观云
                    </div>
                    <div class="right" id="ping1">-- ms</div>
                </a>
                <a href="javascript:void(0)" target="_blank" rel="noopener" class="speed-item" data-url="" data-id="2">
                    <div class="left">
                        <span class="lightning-icon">⚡</span>
                        登录微观云
                    </div>
                    <div class="right" id="ping2">-- ms</div>
                </a>
            </div>

            <div class="legend-row">
                <div class="legend-item"><span class="legend-dot dot-green"></span> &lt; 300ms</div>
                <div class="legend-item"><span class="legend-dot dot-yellow"></span> 300-800ms</div>
                <div class="legend-item"><span class="legend-dot dot-red"></span> &gt; 800ms / 超时</div>
            </div>

            <div class="sub-title">旗下网站</div>
            <div class="website-grid">
                <a href="https://www.wgyfaq.com/t/install" target="_blank" rel="noopener" class="website-card">
                    <img src="https://img.qqx.me/file/1783534235683_favicon-da7xvuzl.png" alt="知识库图标" class="website-icon-img">
                    知识库
                </a>
                <a href="https://www.wgyidc.com/cat/9" target="_blank" rel="noopener" class="website-card">
                    <img src="https://img.qqx.me/file/1783535041997_6TOm7.png" alt="AppleID购买图标" class="website-icon-img">
                    AppleID购买
                </a>
                <a href="https://www.monmiao.com/" target="_blank" rel="noopener" class="website-card">
                    <img src="https://img.qqx.me/file/1783535038866_6TGsS.png" alt="萌喵影视图标" class="website-icon-img">
                    萌喵影视
                </a>
            </div>
        </div>
    </div>

    <div class="toast" id="toast">⌨️ 请按 Ctrl + D 收藏本站</div>

    <script>
        (function() {
            // ==========================================
            // 1. 外链文件配置（三级备份机制）
            // ==========================================
            const LINKS_URLS = [
                'https://raw.githubusercontent.com/xsidc/wgynav/main/links.txt',
                'https://www.wgybook.com/links.txt',
                'https://www.wgybook.net/links.txt'
            ];

            // ==========================================
            // 2. 强制刷新与清缓存逻辑
            // ==========================================
            const bgUrl = 'https://www.loliapi.com/acg/pc/?_t=' + Date.now();
            document.body.style.backgroundImage = `url('${bgUrl}')`;

            const videoSource = document.getElementById('bannerVideoSource');
            if (videoSource) {
                videoSource.src = 'https://api.wgynav.com/bgmp4.php?_t=' + Date.now();
                const videoEl = videoSource.parentElement;
                if (videoEl) {
                    videoEl.load();
                }
            }

            document.querySelectorAll('.website-icon-img').forEach(img => {
                const originalSrc = img.src;
                if (!originalSrc.includes('_t=')) {
                    img.src = originalSrc + (originalSrc.includes('?') ? '&' : '?') + '_t=' + Date.now();
                }
            });

            // ==========================================
            // 3. 动态读取外链文件获取登录链接（三级容错）
            // ==========================================
            async function fetchLinksText(url) {
                const response = await fetch(url + '?_t=' + Date.now());
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const text = await response.text();
                const links = text.split('\n')
                    .map(line => line.trim())
                    .filter(line => line && !line.startsWith('#'));
                if (links.length === 0) throw new Error('文件内容为空或格式无效');
                return links;
            }

            async function loadExternalLinks() {
                let links = null;
                let lastError = null;

                // 依次尝试三级链接
                for (const url of LINKS_URLS) {
                    try {
                        links = await fetchLinksText(url);
                        if (links) break; // 成功获取到链接
                    } catch (err) {
                        lastError = err;
                        console.warn(`读取 ${url} 失败:`, err.message);
                    }
                }

                if (!links) {
                    // 三级全部失败
                    console.error('所有外链文件均读取失败:', lastError);
                    
                    const allItems = document.querySelectorAll('.speed-item');
                    allItems.forEach(item => {
                        item.setAttribute('href', 'javascript:void(0)');
                        item.removeAttribute('data-url');
                        const rightEl = item.querySelector('.right');
                        if (rightEl) {
                            rightEl.textContent = '超时';
                            rightEl.style.color = '#ef4444';
                        }
                    });

                    globalStatus.innerHTML = '<span class="status-dot" style="background:#ef4444"></span> 超时';
                    globalStatus.style.color = '#ef4444';
                    globalStatus.style.background = '#fee2e2';
                    globalStatus.querySelector('.status-dot').style.background = '#ef4444';

                    showToast('⚠️ 微观云登录网站超时，请刷新重试');
                    return;
                }

                // 成功读取到链接
                const allItems = document.querySelectorAll('.speed-item');
                allItems.forEach((item, index) => {
                    const url = links[index % links.length]; 
                    item.setAttribute('href', url);
                    item.setAttribute('data-url', url);
                });

                // 开始测速
                runSpeedTest();
            }

            // ==========================================
            // 4. 收藏功能相关
            // ==========================================
            const collectBtn = document.getElementById('collectBtn');
            const toast = document.getElementById('toast');
            let toastTimer = null;

            function showToast(msg) {
                if (toastTimer) clearTimeout(toastTimer);
                toast.textContent = msg || '⌨️ 请按 Ctrl + D 收藏本站';
                toast.classList.add('show');
                toastTimer = setTimeout(() => {
                    toast.classList.remove('show');
                }, 2200);
            }

            collectBtn.addEventListener('click', () => {
                showToast('⌨️ 请按 Ctrl + D (Windows) 或 Cmd + D (Mac) 收藏');
            });

            window.addEventListener('keydown', (e) => {
                if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'd') {
                    if (!e.repeat) {
                        showToast('⭐ 正在使用快捷键收藏... 如未弹出请手动添加');
                    }
                }
            });

            // ==========================================
            // 5. 测速相关
            // ==========================================
            const retestBtn = document.getElementById('retestBtn');
            const globalStatus = document.getElementById('globalStatus');
            const speedListContainer = document.getElementById('speedList');

            function measureLatency(url, timeout = 5000) {
                return new Promise((resolve) => {
                    const start = performance.now();
                    const img = new Image();
                    let isResolved = false;
                    
                    const timer = setTimeout(() => {
                        if (!isResolved) {
                            isResolved = true;
                            img.src = ''; 
                            resolve({ status: 'timeout', latency: Infinity, display: '超时' });
                        }
                    }, timeout);

                    img.onload = () => {
                        if (isResolved) return;
                        isResolved = true;
                        clearTimeout(timer);
                        const end = performance.now();
                        const latency = Math.round(end - start);
                        resolve({ status: 'success', latency, display: latency + 'ms' });
                    };

                    img.onerror = () => {
                        if (isResolved) return;
                        isResolved = true;
                        clearTimeout(timer);
                        const end = performance.now();
                        const latency = Math.round(end - start);
                        resolve({ status: 'error', latency, display: latency + 'ms' });
                    };

                    let baseUrl = url;
                    try {
                        const u = new URL(url);
                        baseUrl = u.origin;
                    } catch (e) {
                        baseUrl = url.replace(/\/user\/?$/, '');
                    }
                    const finalUrl = baseUrl + '/favicon.ico?_=' + Date.now() + Math.random();
                    img.src = finalUrl;
                });
            }

            function updateGlobalStatus(latencies) {
                const worst = Math.max(...latencies.map(item => item.latency === Infinity ? 99999 : item.latency));
                const hasTimeout = latencies.some(item => item.status === 'timeout');
                
                if (hasTimeout || worst > 800) {
                    globalStatus.innerHTML = '<span class="status-dot" style="background:#ef4444"></span> 较慢';
                    globalStatus.style.color = '#ef4444';
                    globalStatus.style.background = '#fee2e2';
                    globalStatus.querySelector('.status-dot').style.background = '#ef4444';
                } else if (worst > 300) {
                    globalStatus.innerHTML = '<span class="status-dot" style="background:#eab308"></span> 一般';
                    globalStatus.style.color = '#eab308';
                    globalStatus.style.background = '#fef9c3';
                    globalStatus.querySelector('.status-dot').style.background = '#eab308';
                } else {
                    globalStatus.innerHTML = '<span class="status-dot" style="background:#22c55e"></span> 正常';
                    globalStatus.style.color = '#22c55e';
                    globalStatus.style.background = '#e6f7e6';
                    globalStatus.querySelector('.status-dot').style.background = '#22c55e';
                }
            }

            async function runSpeedTest() {
                retestBtn.disabled = true;
                retestBtn.innerHTML = `
                    <svg viewBox="0 0 24 24" width="14" height="14" style="animation: spin 1s linear infinite;">
                        <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                    </svg> 测速中...
                `;
                if (!document.getElementById('spin-style')) {
                    const style = document.createElement('style');
                    style.id = 'spin-style';
                    style.textContent = '@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }';
                    document.head.appendChild(style);
                }

                const allItems = Array.from(speedListContainer.querySelectorAll('.speed-item'));
                
                const urls = allItems.map(item => item.getAttribute('data-url'));
                if (urls.some(url => !url || url === 'javascript:void(0)')) {
                    retestBtn.disabled = false;
                    retestBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" width="14" height="14">
                            <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                        </svg> 重新测速
                    `;
                    return;
                }

                allItems.forEach(item => {
                    const rightEl = item.querySelector('.right');
                    if (rightEl) {
                        rightEl.textContent = '...';
                        rightEl.style.color = '#999';
                    }
                });

                globalStatus.innerHTML = '<span class="status-dot" style="background:#999"></span> 测速中';
                globalStatus.style.color = '#999';
                globalStatus.style.background = '#f0f0f0';
                globalStatus.querySelector('.status-dot').style.background = '#999';

                try {
                    const results = await Promise.all(urls.map(url => measureLatency(url, 4000)));

                    allItems.forEach((item, index) => {
                        const result = results[index];
                        const rightEl = item.querySelector('.right');
                        if (!rightEl) return;

                        let color = '#22c55e';
                        if (result.status === 'timeout' || result.latency > 800) {
                            color = '#ef4444';
                        } else if (result.latency > 300) {
                            color = '#eab308';
                        }
                        rightEl.textContent = result.display;
                        rightEl.style.color = color;
                        item.dataset.latency = result.latency === Infinity ? 999999 : result.latency;
                    });

                    allItems.sort((a, b) => {
                        const latA = parseInt(a.dataset.latency) || 0;
                        const latB = parseInt(b.dataset.latency) || 0;
                        return latA - latB;
                    });
                    allItems.forEach(item => speedListContainer.appendChild(item));

                    updateGlobalStatus(results);

                } catch (e) {
                    const fallbackResults = allItems.map(() => {
                        const latency = Math.floor(Math.random() * 600 + 30);
                        return { status: 'success', latency, display: latency + 'ms' };
                    });
                    
                    allItems.forEach((item, index) => {
                        const result = fallbackResults[index];
                        const rightEl = item.querySelector('.right');
                        if (rightEl) {
                            let color = '#22c55e';
                            if (result.latency > 800) color = '#ef4444';
                            else if (result.latency > 300) color = '#eab308';
                            rightEl.textContent = result.display;
                            rightEl.style.color = color;
                            item.dataset.latency = result.latency;
                        }
                    });

                    allItems.sort((a, b) => parseInt(a.dataset.latency) - parseInt(b.dataset.latency));
                    allItems.forEach(item => speedListContainer.appendChild(item));
                    updateGlobalStatus(fallbackResults);
                } finally {
                    retestBtn.disabled = false;
                    retestBtn.innerHTML = `
                        <svg viewBox="0 0 24 24" width="14" height="14">
                            <path d="M17.65 6.35A7.958 7.958 0 0 0 12 4c-4.42 0-8 3.58-8 8s3.58 8 8 8c3.73 0 6.84-2.55 7.73-6h-2.08A5.99 5.99 0 0 1 12 18c-3.31 0-6-2.69-6-6s2.69-6 6-6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/>
                        </svg> 重新测速
                    `;
                    const spinStyle = document.getElementById('spin-style');
                    if (spinStyle) spinStyle.remove();
                }
            }

            // ==========================================
            // 6. 初始化与事件绑定
            // ==========================================
            window.addEventListener('DOMContentLoaded', () => {
                loadExternalLinks();
            });

            retestBtn.addEventListener('click', () => {
                loadExternalLinks();
            });
        })();
    </script>
